name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folio-release.p12"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/folio-release.p12 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOLIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-release-apk
          path: app/build/outputs/apk/release/app-release.apk
